<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Il Sangue Rosso</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
<div id="app-shell"></div>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
let MEMBRE = null;
let RAW = { membres:{}, grades:{}, stock:{}, actions_dispo:{}, config:{} };
let activeTab = "membres";

(async function init(){
  MEMBRE = await requireSession();
  if (!MEMBRE) return;
  if (MEMBRE.role !== "admin") {
    document.body.innerHTML = "<p style='color:#fff;padding:40px;'>Accès réservé aux administrateurs.</p>";
    return;
  }
  initShell("admin", MEMBRE);
  render();
  db.ref("membres").on("value", s => { RAW.membres = s.val() || {}; render(); });
  db.ref("grades").on("value", s => { RAW.grades = s.val() || {}; render(); });
  db.ref("stock").on("value", s => { RAW.stock = s.val() || {}; render(); });
  db.ref("actions_dispo").on("value", s => { RAW.actions_dispo = s.val() || {}; render(); });
  db.ref("config").on("value", s => { RAW.config = s.val() || {}; render(); });
})();

const ADMIN_TABS = [
  { id: "membres", nom: "Membres" },
  { id: "grades", nom: "Grades" },
  { id: "stock", nom: "Stock" },
  { id: "actions", nom: "Actions Tracker" },
  { id: "config", nom: "Config" },
  { id: "semaine", nom: "Semaine" }
];

function selectAdminTab(id){ activeTab = id; render(); }

function render(){
  const content = document.getElementById("page-content");
  content.innerHTML = `
    <div class="page-header"><div><h1>Admin</h1><div class="sub">Gestion du groupe</div></div></div>
    <div class="tabs">
      ${ADMIN_TABS.map(t => `<div class="tab ${activeTab===t.id?'active':''}" onclick="selectAdminTab('${t.id}')">${t.nom}</div>`).join("")}
    </div>
    <div id="adminContent"></div>
  `;
  const el = document.getElementById("adminContent");
  if (activeTab === "membres") el.innerHTML = renderMembres();
  if (activeTab === "grades") el.innerHTML = renderGrades();
  if (activeTab === "stock") el.innerHTML = renderStock();
  if (activeTab === "actions") el.innerHTML = renderActions();
  if (activeTab === "config") el.innerHTML = renderConfig();
  if (activeTab === "semaine") el.innerHTML = renderSemaine();
}

// ---------------- MEMBRES ----------------
function renderMembres(){
  const membres = Object.entries(RAW.membres||{});
  const grades = Object.entries(RAW.grades||{});
  return `
    <div class="panel">
      <h2>Ajouter un membre</h2>
      <div class="form-row">
        <div><label>Prénom</label><input type="text" id="mPrenom"></div>
        <div><label>Identifiant</label><input type="text" id="mIdentifiant"></div>
        <div><label>Mot de passe</label><input type="text" id="mMdp"></div>
        <div><label>Grade</label>
          <select id="mGrade">${grades.map(([id,g]) => `<option value="${g.nom}">${g.nom}</option>`).join("") || `<option value="">Membre</option>`}</select>
        </div>
        <div><label>Rôle</label>
          <select id="mRole"><option value="membre">Membre</option><option value="admin">Admin</option></select>
        </div>
      </div>
      <button class="btn-or" onclick="ajouterMembre()">Ajouter</button>
    </div>
    <div class="panel">
      <h2>Membres (${membres.length})</h2>
      ${membres.length ? `
      <table>
        <thead><tr><th>Prénom</th><th>Identifiant</th><th>Grade</th><th>Rôle</th><th></th></tr></thead>
        <tbody>
          ${membres.map(([id,m]) => `
            <tr>
              <td>${m.prenom}</td>
              <td>${m.identifiant}</td>
              <td>${m.grade||""}</td>
              <td><span class="badge ${m.role==='admin'?'badge-or':'badge-succes'}">${m.role||"membre"}</span></td>
              <td>${m.protege ? "" : `<button class="btn-ghost btn-sm" onclick="supprimerMembre('${id}')">🗑</button>`}</td>
            </tr>`).join("")}
        </tbody>
      </table>` : `<div class="empty-state">Aucun membre pour l'instant.</div>`}
    </div>
  `;
}

function ajouterMembre(){
  const prenom = document.getElementById("mPrenom").value.trim();
  const identifiant = document.getElementById("mIdentifiant").value.trim();
  const motdepasse = document.getElementById("mMdp").value;
  const grade = document.getElementById("mGrade").value;
  const role = document.getElementById("mRole").value;
  if (!prenom || !identifiant || !motdepasse) return;
  db.ref("membres").push({ prenom, identifiant, motdepasse, grade, role, permissions: PAGES_DISPO.map(p=>p.id) });
  document.getElementById("mPrenom").value = "";
  document.getElementById("mIdentifiant").value = "";
  document.getElementById("mMdp").value = "";
}

function supprimerMembre(id){
  if (!confirm("Supprimer ce membre ?")) return;
  db.ref(`membres/${id}`).remove();
}

// ---------------- GRADES ----------------
function renderGrades(){
  const grades = Object.entries(RAW.grades||{});
  return `
    <div class="panel">
      <h2>Ajouter un grade</h2>
      <div class="form-row">
        <div><label>Nom</label><input type="text" id="gNom"></div>
        <div><label>Ordre (hiérarchie, 1 = le plus haut)</label><input type="number" id="gOrdre"></div>
      </div>
      <button class="btn-or" onclick="ajouterGrade()">Ajouter</button>
    </div>
    <div class="panel">
      <h2>Grades</h2>
      ${grades.length ? `
      <table>
        <thead><tr><th>Nom</th><th>Ordre</th><th></th></tr></thead>
        <tbody>
          ${grades.sort((a,b)=>(a[1].ordre||0)-(b[1].ordre||0)).map(([id,g]) => `
            <tr><td>${g.nom}</td><td>${g.ordre||""}</td><td><button class="btn-ghost btn-sm" onclick="supprimerGrade('${id}')">🗑</button></td></tr>
          `).join("")}
        </tbody>
      </table>` : `<div class="empty-state">Aucun grade.</div>`}
    </div>
  `;
}

function ajouterGrade(){
  const nom = document.getElementById("gNom").value.trim();
  const ordre = parseInt(document.getElementById("gOrdre").value) || 0;
  if (!nom) return;
  db.ref("grades").push({ nom, ordre });
  document.getElementById("gNom").value = "";
  document.getElementById("gOrdre").value = "";
}

function supprimerGrade(id){
  if (!confirm("Supprimer ce grade ?")) return;
  db.ref(`grades/${id}`).remove();
}

// ---------------- STOCK (catégories, produits, recettes, "vend vers") ----------------
function renderStock(){
  const categories = Object.entries(RAW.stock||{});
  return `
    <div class="panel">
      <h2>Ajouter une catégorie</h2>
      <div class="form-row">
        <div><label>Nom (ex: Drogue, Matériel, Labo)</label><input type="text" id="cNom"></div>
        <div><label>Emoji</label><input type="text" id="cEmoji" placeholder="📦"></div>
      </div>
      <button class="btn-or" onclick="ajouterCategorie()">Ajouter</button>
    </div>

    ${categories.map(([catId,cat]) => `
      <div class="panel">
        <h2>${cat.emoji||""} ${cat.nom} <button class="btn-ghost btn-sm" onclick="supprimerCategorie('${catId}')" style="float:right;">🗑 Catégorie</button></h2>
        <div class="form-row">
          <div><label>Nouveau produit</label><input type="text" id="pNom_${catId}"></div>
          <div><label>Prix</label><input type="number" id="pPrix_${catId}"></div>
          <div><label>Seuil</label><input type="number" id="pSeuil_${catId}"></div>
        </div>
        <button class="btn-or btn-sm" onclick="ajouterProduit('${catId}')">Ajouter produit</button>

        ${Object.entries(cat.produits||{}).length ? `
        <table style="margin-top:14px;">
          <thead><tr><th>Produit</th><th>Prix</th><th>Stock</th><th>Seuil</th><th>Recette (Labo)</th><th>Vend vers</th><th></th></tr></thead>
          <tbody>
            ${Object.entries(cat.produits).map(([pid,p]) => `
              <tr>
                <td>${p.nom}</td>
                <td>${p.prix||0} $</td>
                <td>${p.stock||0}</td>
                <td>${p.seuil||0}</td>
                <td>${cat.nom==="Labo" ? `<button class="btn-ghost btn-sm" onclick="editerRecette('${catId}','${pid}')">✏️ ${(p.recipe||[]).length} ingr.</button>` : "-"}</td>
                <td>${cat.nom==="Labo" ? `<button class="btn-ghost btn-sm" onclick="configurerVente('${catId}','${pid}')">${p.venteCatId ? "✏️ configuré" : "Configurer"}</button>` : "-"}</td>
                <td><button class="btn-ghost btn-sm" onclick="supprimerProduit('${catId}','${pid}')">🗑</button></td>
              </tr>
            `).join("")}
          </tbody>
        </table>` : `<div class="empty-state">Aucun produit dans cette catégorie.</div>`}
      </div>
    `).join("")}
  `;
}

function ajouterCategorie(){
  const nom = document.getElementById("cNom").value.trim();
  const emoji = document.getElementById("cEmoji").value.trim();
  if (!nom) return;
  db.ref("stock").push({ nom, emoji, produits:{} });
  document.getElementById("cNom").value = "";
  document.getElementById("cEmoji").value = "";
}

function supprimerCategorie(catId){
  if (!confirm("Supprimer cette catégorie et tous ses produits ?")) return;
  db.ref(`stock/${catId}`).remove();
}

function ajouterProduit(catId){
  const nom = document.getElementById(`pNom_${catId}`).value.trim();
  const prix = parseFloat(document.getElementById(`pPrix_${catId}`).value) || 0;
  const seuil = parseFloat(document.getElementById(`pSeuil_${catId}`).value) || 0;
  if (!nom) return;
  db.ref(`stock/${catId}/produits`).push({ nom, prix, seuil, stock: 0 });
  document.getElementById(`pNom_${catId}`).value = "";
  document.getElementById(`pPrix_${catId}`).value = "";
  document.getElementById(`pSeuil_${catId}`).value = "";
}

function supprimerProduit(catId, pid){
  if (!confirm("Supprimer ce produit ?")) return;
  db.ref(`stock/${catId}/produits/${pid}`).remove();
}

function editerRecette(catId, pid){
  const p = RAW.stock[catId].produits[pid];
  const ingredients = prompt("Ingrédients (format: nom:quantité, séparés par des virgules)\nEx: Charbon:2, Verre:1", (p.recipe||[]).map(r=>`${r.nom}:${r.quantite}`).join(", "));
  if (ingredients === null) return;
  const recipe = ingredients.split(",").map(s => s.trim()).filter(Boolean).map((s,i) => {
    const [nom,qte] = s.split(":").map(x=>x.trim());
    return { id: (p.recipe && p.recipe[i] && p.recipe[i].id) || `ing_${Date.now()}_${i}`, nom, quantite: parseFloat(qte)||1 };
  });
  db.ref(`stock/${catId}/produits/${pid}/recipe`).set(recipe);
}

function configurerVente(catId, pid){
  const categories = Object.entries(RAW.stock||{}).filter(([id]) => id !== catId);
  const options = categories.flatMap(([cid,c]) => Object.entries(c.produits||{}).map(([ppid,pp]) => `${cid}|${ppid} = ${c.nom} → ${pp.nom}`)).join("\n");
  const choix = prompt("Vend vers (colle exactement 'catId|produitId' d'une des lignes ci-dessous) :\n" + options);
  if (!choix) return;
  const [venteCatId, venteProdId] = choix.split("|").map(s=>s.trim());
  if (!venteCatId || !venteProdId) return;
  db.ref(`stock/${catId}/produits/${pid}`).update({ venteCatId, venteProdId });
}

// ---------------- ACTIONS TRACKER ----------------
function renderActions(){
  const actions = Object.entries(RAW.actions_dispo||{});
  return `
    <div class="panel">
      <h2>Ajouter une action de tracker</h2>
      <div class="form-row">
        <div><label>Nom (ex: Fleeca, Armurerie, Labo, Vente)</label><input type="text" id="aNom"></div>
      </div>
      <button class="btn-or" onclick="ajouterAction()">Ajouter</button>
    </div>
    <div class="panel">
      <h2>Actions disponibles</h2>
      ${actions.length ? `
      <table>
        <thead><tr><th>Nom</th><th></th></tr></thead>
        <tbody>
          ${actions.map(([id,a]) => `<tr><td>${a.nom}</td><td><button class="btn-ghost btn-sm" onclick="supprimerAction('${id}')">🗑</button></td></tr>`).join("")}
        </tbody>
      </table>` : `<div class="empty-state">Aucune action configurée.</div>`}
      <div class="sub" style="margin-top:10px;">"Labo" est automatiquement exclue du menu déroulant du Tracker (la production passe par la page Labo dédiée).</div>
    </div>
  `;
}

function ajouterAction(){
  const nom = document.getElementById("aNom").value.trim();
  if (!nom) return;
  db.ref("actions_dispo").push({ nom });
  document.getElementById("aNom").value = "";
}

function supprimerAction(id){
  if (!confirm("Supprimer cette action ?")) return;
  db.ref(`actions_dispo/${id}`).remove();
}

// ---------------- CONFIG ----------------
function renderConfig(){
  const c = RAW.config || {};
  return `
    <div class="panel">
      <h2>Paramètres du groupe</h2>
      <div class="form-row">
        <div><label>Taux blanchiment (0-1)</label><input type="number" step="0.01" id="cfgBlanchiment" value="${c.blanchiment_taux ?? 0.7}"></div>
        <div><label>Taux paye drogue (0-1)</label><input type="number" step="0.01" id="cfgPayeDrogue" value="${c.taux_paye_drogue ?? 0.1}"></div>
        <div><label>Taux paye autres (0-1)</label><input type="number" step="0.01" id="cfgPayeAutres" value="${c.taux_paye_autres ?? 0.1}"></div>
        <div><label>Webhook Discord (résumé semaine)</label><input type="text" id="cfgWebhook" value="${c.discord_webhook_semaine || ""}"></div>
      </div>
      <button class="btn-or" onclick="sauverConfig()">Enregistrer</button>
    </div>
  `;
}

function sauverConfig(){
  db.ref("config").update({
    blanchiment_taux: parseFloat(document.getElementById("cfgBlanchiment").value) || 0,
    taux_paye_drogue: parseFloat(document.getElementById("cfgPayeDrogue").value) || 0,
    taux_paye_autres: parseFloat(document.getElementById("cfgPayeAutres").value) || 0,
    discord_webhook_semaine: document.getElementById("cfgWebhook").value.trim()
  });
  alert("Config enregistrée.");
}

// ---------------- SEMAINE (clôture + résumé image) ----------------
function renderSemaine(){
  return `
    <div class="panel">
      <h2>Clôturer la semaine</h2>
      <p class="sub" style="margin-bottom:14px;">Génère un résumé image (podium, ventes, classement) et l'envoie sur le webhook Discord configuré.</p>
      <button class="btn-or" onclick="genererResume()">Bloquer + Résumé</button>
      <div id="resumePreview" style="margin-top:16px;"></div>
    </div>
  `;
}

function semaineIdCourante(){
  const d = new Date();
  const onejan = new Date(d.getFullYear(),0,1);
  const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay()+1)/7);
  return `${d.getFullYear()}-S${week}`;
}

async function genererResume(){
  const SEMAINE_ID = semaineIdCourante();
  const txSnap = await db.ref("transactions").once("value");
  const transactions = Object.values(txSnap.val() || {});
  const ventes = transactions.filter(t => t.type === "vente");
  const parMembre = {};
  ventes.forEach(t => { parMembre[t.membreId] = (parMembre[t.membreId]||0) + (t.montant||0); });
  const membresSnap = await db.ref("membres").once("value");
  const membres = membresSnap.val() || {};
  const classement = Object.entries(parMembre).sort((a,b) => b[1]-a[1]).slice(0,10);
  const totalGain = ventes.reduce((a,t)=>a+(t.montant||0),0);

  const canvas = document.createElement("canvas");
  canvas.width = 1200; canvas.height = 900;
  const ctx = canvas.getContext("2d");

  const grad = ctx.createLinearGradient(0,0,0,900);
  grad.addColorStop(0, "#1a1200");
  grad.addColorStop(1, "#0a0a0a");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,1200,900);

  ctx.fillStyle = "#e8cd7a";
  ctx.font = "bold 42px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("IL SANGUE ROSSO", 600, 70);
  ctx.font = "20px sans-serif";
  ctx.fillStyle = "#8a8a8a";
  ctx.fillText(`Résumé semaine ${SEMAINE_ID}`, 600, 100);

  ctx.font = "bold 64px sans-serif";
  ctx.fillStyle = "#c9a24a";
  ctx.fillText(`${totalGain.toLocaleString()} $`, 600, 190);
  ctx.font = "18px sans-serif";
  ctx.fillStyle = "#cfcfcf";
  ctx.fillText("Gain total de la semaine", 600, 220);

  ctx.textAlign = "left";
  ctx.font = "bold 24px sans-serif";
  ctx.fillStyle = "#e8cd7a";
  ctx.fillText("Classement", 100, 290);

  let y = 330;
  classement.forEach(([id,montant], i) => {
    ctx.beginPath();
    ctx.fillStyle = i===0 ? "#c9a24a" : i===1 ? "#cfcfcf" : i===2 ? "#8a6d2f" : "#333";
    ctx.arc(120, y-8, 14, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "#0a0a0a";
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(i+1), 120, y-3);
    ctx.textAlign = "left";
    ctx.fillStyle = "#f5f0e6";
    ctx.font = "18px sans-serif";
    ctx.fillText((membres[id]||{}).prenom || "?", 150, y-2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#c9a24a";
    ctx.fillText(`${montant.toLocaleString()} $`, 1100, y-2);
    ctx.textAlign = "left";
    y += 40;
  });

  const dataUrl = canvas.toDataURL("image/png");
  document.getElementById("resumePreview").innerHTML = `<img src="${dataUrl}" style="max-width:100%; border-radius:8px; border:1px solid var(--bord);">`;

  const webhook = (RAW.config || {}).discord_webhook_semaine;
  if (webhook) {
    canvas.toBlob(async (blob) => {
      const form = new FormData();
      form.append("payload_json", JSON.stringify({ embeds: [{ image: { url: "attachment://resume.png" } }] }));
      form.append("files[0]", blob, "resume.png");
      try {
        await fetch(webhook, { method: "POST", body: form });
      } catch (e) { console.error("Envoi webhook échoué", e); }
    });
  }
}
</script>
</body>
</html>
