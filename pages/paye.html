<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paye — Il Sangue Rosso</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
<div id="app-shell"></div>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
let MEMBRE = null;
let RAW = { membres:{}, transactions:{}, actions:{}, config:{}, payes:{} };

function semaineIdCourante(){
  const d = new Date();
  const onejan = new Date(d.getFullYear(),0,1);
  const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay()+1)/7);
  return `${d.getFullYear()}-S${week}`;
}
const SEMAINE_ID = semaineIdCourante();

(async function init(){
  MEMBRE = await requireSession();
  if (!MEMBRE) return;
  initShell("paye", MEMBRE);
  render();
  db.ref("membres").on("value", s => { RAW.membres = s.val() || {}; render(); });
  db.ref("transactions").on("value", s => { RAW.transactions = s.val() || {}; render(); });
  db.ref("config").on("value", s => { RAW.config = s.val() || {}; render(); });
  db.ref(`payes/${SEMAINE_ID}`).on("value", s => { RAW.payes = s.val() || {}; render(); });
})();

function calculerPaye(membreId){
  const taux = RAW.config.taux_paye_drogue ?? 0.1;
  const ventes = Object.values(RAW.transactions||{}).filter(t => t.membreId === membreId && t.type === "vente");
  return ventes.reduce((a,t) => a + (t.montant||0), 0) * taux;
}

function render(){
  const content = document.getElementById("page-content");
  const membres = Object.entries(RAW.membres||{});

  content.innerHTML = `
    <div class="page-header"><div><h1>Paye</h1><div class="sub">Semaine ${SEMAINE_ID}</div></div></div>
    <div class="panel">
      ${membres.length ? `
      <table>
        <thead><tr><th>Membre</th><th>Grade</th><th>Paye calculée</th><th>Statut</th><th></th></tr></thead>
        <tbody>
          ${membres.map(([id,m]) => {
            const montant = calculerPaye(id);
            const paye = RAW.payes?.[id];
            return `<tr>
              <td>${m.prenom}</td>
              <td>${m.grade||""}</td>
              <td>${montant.toLocaleString()} $</td>
              <td>${paye ? `<span class="badge badge-succes">Payé</span>` : `<span class="badge badge-danger">En attente</span>`}</td>
              <td>${paye ? "" : `<button class="btn-or btn-sm" onclick="payer('${id}')">Payer</button>`}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>` : `<div class="empty-state">Aucun membre.</div>`}
    </div>
  `;
}

// Ne reçoit que l'ID (jamais le prénom en dur dans l'onclick) — récupère le prénom depuis RAW.membres
// pour éviter les guillemets dans les surnoms qui cassent l'attribut HTML.
function payer(membreId){
  const m = RAW.membres[membreId];
  if (!m) return;
  const montant = calculerPaye(membreId);
  if (!confirm(`Confirmer le paiement de ${montant.toLocaleString()} $ à ${m.prenom} ?`)) return;

  db.ref(`payes/${SEMAINE_ID}/${membreId}`).set({ montant, date: new Date().toISOString() });
  db.ref("argent/sale").transaction(v => Math.max(0,(v||0)-montant));
}
</script>
</body>
</html>
