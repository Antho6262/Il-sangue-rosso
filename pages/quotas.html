<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotas — Il Sangue Rosso</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
<div id="app-shell"></div>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
let MEMBRE = null;
let RAW = { membres:{}, actions:{}, quotas:{} };

function semaineIdCourante(){
  const d = new Date();
  const onejan = new Date(d.getFullYear(),0,1);
  const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay()+1)/7);
  return `${d.getFullYear()}-S${week}`;
}
const SEMAINE_ID = semaineIdCourante();

(async function init(){
  MEMBRE = await requireSession();
  if (!MEMBRE) return;
  initShell("quotas", MEMBRE);
  render();
  db.ref("membres").on("value", s => { RAW.membres = s.val() || {}; render(); });
  db.ref(`actions/${SEMAINE_ID}`).on("value", s => { RAW.actions = s.val() || {}; render(); });
  db.ref("quotas").on("value", s => { RAW.quotas = s.val() || {}; render(); });
})();

// Le Labo compte 1 par production (une fournée), pas la quantité — logique différente des autres catégories
function compterActionsParMembre(){
  const compte = {};
  Object.values(RAW.actions||{}).forEach(a => {
    compte[a.membreId] = compte[a.membreId] || {};
    compte[a.membreId][a.actionNom] = (compte[a.membreId][a.actionNom]||0) + 1;
  });
  return compte;
}

function render(){
  const content = document.getElementById("page-content");
  const compte = compterActionsParMembre();
  const membres = Object.entries(RAW.membres||{});

  content.innerHTML = `
    <div class="page-header"><div><h1>Quotas</h1><div class="sub">Semaine ${SEMAINE_ID}</div></div></div>
    <div class="panel">
      <h2>Suivi par membre</h2>
      ${membres.length ? `
      <table>
        <thead><tr><th>Membre</th><th>Total actions</th><th>Détail</th></tr></thead>
        <tbody>
          ${membres.map(([id,m]) => {
            const c = compte[id] || {};
            const total = Object.values(c).reduce((a,b)=>a+b,0);
            const detail = Object.entries(c).map(([nom,n]) => `${nom}: ${n}`).join(" · ") || "-";
            const quota = RAW.quotas?.[id]?.objectif || 0;
            const badge = quota && total >= quota ? "badge-succes" : "badge-danger";
            return `<tr>
              <td>${m.prenom}</td>
              <td><span class="badge ${badge}">${total}${quota ? " / "+quota : ""}</span></td>
              <td>${detail}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>` : `<div class="empty-state">Aucun membre.</div>`}
    </div>
  `;
}
</script>
</body>
</html>
