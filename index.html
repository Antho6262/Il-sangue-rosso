<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il Sangue Rosso — Connexion</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <img src="img/logo.png" class="logo" alt="Il Sangue Rosso">
      <h1>IL SANGUE ROSSO</h1>
      <div class="devise">FAMIGLIA · ONORE · LEALTÀ</div>
      <label style="text-align:left; margin-bottom:5px;">Membre</label>
      <select id="membreSelect">
        <option value="">— Sélectionner —</option>
      </select>
      <input type="password" id="motdepasse" placeholder="Mot de passe">
      <button onclick="seConnecter()">Se connecter</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script>
    let MEMBRES_CACHE = {};

    // Redirige direct si déjà connecté
    (function(){
      const s = getSession();
      if (s && s.id) window.location.href = "pages/dashboard.html";
    })();

    // Charge la liste des membres (triés par prénom) dans le menu déroulant
    (async function chargerMembres(){
      const snap = await db.ref("membres").once("value");
      MEMBRES_CACHE = snap.val() || {};
      const sel = document.getElementById("membreSelect");
      Object.entries(MEMBRES_CACHE)
        .sort((a,b) => (a[1].prenom||"").localeCompare(b[1].prenom||""))
        .forEach(([id, m]) => {
          const opt = document.createElement("option");
          opt.value = id;
          opt.textContent = m.prenom;
          sel.appendChild(opt);
        });
    })();

    async function seConnecter() {
      const membreId = document.getElementById("membreSelect").value;
      const mdp = document.getElementById("motdepasse").value;
      const err = document.getElementById("loginError");
      err.textContent = "";
      if (!membreId || !mdp) { err.textContent = "Sélectionne ton nom et entre ton mot de passe."; return; }

      const m = MEMBRES_CACHE[membreId];
      if (!m || m.motdepasse !== mdp) { err.textContent = "Mot de passe incorrect."; return; }

      setSession({ id: membreId, ...m });
      window.location.href = "pages/dashboard.html";
    }

    document.getElementById("motdepasse").addEventListener("keydown", e => {
      if (e.key === "Enter") seConnecter();
    });
  </script>
</body>
</html>
